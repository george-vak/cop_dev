[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mood-project"
version = "0.1.1"
description = "Client-server monster game project"
authors = [{name = "George Vakulenko"}]
readme = "README.md"
requires-python = ">=3.7"

dependencies = [
    "cowsay-python"
]

[project.scripts]
client = "mood.client.__main__:main"
server = "mood.server.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "black", "mypy"]

[tool.setuptools]
packages = ["mood", "mood.client", "mood.server"]
include-package-data = true

[tool.setuptools.package-data]
"mood" = [
    "docs/build/html/**/*",
    "server/locale/**/messages.mo",
    "client/config.py",
    "*.txt"
]
